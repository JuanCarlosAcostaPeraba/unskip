name: CI

on:
  push:
    branches:
      - dev
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  validation:
    name: Windows build and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Test automatic release versioning
        shell: pwsh
        run: ./eng/test-release-version-resolver.ps1

      - name: Restore
        run: dotnet restore Unskip.sln

      - name: Verify formatting and analyzers
        run: dotnet format Unskip.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Unskip.sln --configuration Release --no-restore

      - name: Test deterministic suite
        run: >
          dotnet test Unskip.sln
          --configuration Release
          --no-build
          --no-restore
          --filter "Category!=NativeIntegration"
          --logger "trx;LogFilePrefix=unskip"
          --results-directory artifacts/test-results
          --collect "XPlat Code Coverage"

      - name: Audit NuGet dependencies
        run: dotnet list Unskip.sln package --vulnerable --include-transitive

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.run_id }}
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
