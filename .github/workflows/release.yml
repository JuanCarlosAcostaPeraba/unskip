name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NSIS_COMPILER_SHA256: B043E554AFEFBFC56315669D0B4779793AEAE67F0F2A7A790E2EA91F05298EFF

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Resolve and validate release version
        id: version
        shell: pwsh
        run: |
          git fetch origin --tags
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to fetch existing release tags.'
          }

          $release = ./eng/resolve-release-version.ps1 `
            -RepositoryRoot . `
            -Commit '${{ github.sha }}'
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "tag=$($release.Tag)" >> $env:GITHUB_OUTPUT
          "tag_exists=$($release.TagExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          Write-Host "Release version: $($release.Version)"
          Write-Host "Release tag: $($release.Tag)"
          Write-Host "Tag already exists at this commit: $($release.TagExists)"

      - name: Restore
        run: >
          dotnet restore Unskip.sln
          -p:Version=${{ steps.version.outputs.version }}

      - name: Verify formatting and analyzers
        run: dotnet format Unskip.sln --verify-no-changes --no-restore

      - name: Build
        run: >
          dotnet build Unskip.sln
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}+${{ github.sha }}
          -p:IncludeSourceRevisionInInformationalVersion=false

      - name: Test deterministic suite
        run: >
          dotnet test Unskip.sln
          --configuration Release
          --no-build
          --no-restore
          --filter "Category!=NativeIntegration"
          -p:Version=${{ steps.version.outputs.version }}

      - name: Audit NuGet dependencies
        run: dotnet list Unskip.sln package --vulnerable --include-transitive

      - name: Install pinned NSIS compiler
        id: nsis
        shell: pwsh
        run: |
          winget install `
            --id NSIS.NSIS `
            --version 3.12 `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS installation failed with exit code $LASTEXITCODE."
          }

          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "NSIS compiler was not found at $compiler."
          }

          $actualHash = (Get-FileHash -LiteralPath $compiler -Algorithm SHA256).Hash
          if ($actualHash -ne $env:NSIS_COMPILER_SHA256) {
            throw "NSIS compiler checksum mismatch. Expected $env:NSIS_COMPILER_SHA256, received $actualHash."
          }

          "compiler=$compiler" >> $env:GITHUB_OUTPUT

      - name: Build installer and portable archive
        shell: pwsh
        run: >
          ./eng/package.ps1
          -Version '${{ steps.version.outputs.version }}'
          -NsisCompiler '${{ steps.nsis.outputs.compiler }}'

      - name: Upload release build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Unskip-${{ steps.version.outputs.version }}-win-x64
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30

      - name: Create release tag
        if: steps.version.outputs.tag_exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate $env:RELEASE_TAG --message "Unskip $env:RELEASE_VERSION" '${{ github.sha }}'
          git push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to publish release tag $env:RELEASE_TAG."
          }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath artifacts/release -File | ForEach-Object FullName
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $assets --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to replace the assets for release $env:RELEASE_TAG."
            }
            exit 0
          }

          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            '--verify-tag',
            '--generate-notes',
            '--title', "Unskip $env:RELEASE_VERSION"
          )
          $arguments += $assets
          gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create release $env:RELEASE_TAG."
          }
